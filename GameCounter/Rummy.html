<body>
    <div class="card">
    <div class = "Newgamecard">
        <a href="Players.html" >
        <p class = "ngtext">New Game</p>

    <div class = "Continuegamecard">
        <a href="Game.html" onclick="resumeExistingGame()" id="resumeBtn" style="display: none;">
        <p class = "cgtext">Continue Game</p>
    </div>

        <p class = "pltext">Players</p>

</div>
<a href = "Title.html"><button>Home</button></a>
<script>
    function resumeExistingGame() {
        // Just navigates — state already in localStorage
    }

    // Show button if game in progress
    window.onload = function () {
        if (localStorage.getItem("gameInProgress") === "true") {
            document.getElementById("resumeBtn").style.display = "inline-block";
        }
    }
</script>
</body>
